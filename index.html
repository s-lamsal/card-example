<!DOCTYPE html>
<html>
<head>
    <title>String Occurrence</title>
</head>

<body>

    <h2>Find Occurrence of a String</h2>

    <label>Enter a string:</label><br>
    <input type="text" id="mainString">

    <br><br>

    <label>Enter string to search:</label><br>
    <input type="text" id="searchString">

    <br><br>

    <button onclick="findOccurrence()">Find Occurrence</button>

    <br><br>

    <h3>Your result is:</h3>

    <div id="result" style="border: 1px solid black; padding: 15px; width: 400px;">
        Result will be displayed here
    </div>


    <script>

        function findOccurrence() {

            let mainString = document.getElementById("mainString").value;
            let searchString = document.getElementById("searchString").value;

            if (mainString == "" || searchString == "") {
                document.getElementById("result").innerHTML =
                    "Please enter both strings.";
                return;
            }

            let count = 0;
            let position = 0;

            // Find occurrence of searchString
            while ((position = mainString.indexOf(searchString, position)) != -1) {
                count++;
                position = position + searchString.length;
            }

            if (count > 0) {
                document.getElementById("result").innerHTML =
                    "The string \"" + searchString + "\" occurs " +
                    count + " time(s).";
            } else {
                document.getElementById("result").innerHTML =
                    "The given string was not found.";
            }
        }

    </script>

</body>
</html>
