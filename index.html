<!DOCTYPE html>
<html>
<head>
    <title>Number Operations</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

    <h2>Number Operations</h2>

    <!-- Input fields -->
    <input type="number" id="num1" placeholder="Enter number 1">
    <input type="number" id="num2" placeholder="Enter number 2">
    <input type="number" id="num3" placeholder="Enter number 3">
    <input type="number" id="num4" placeholder="Enter number 4">

    <br><br>

    <!-- Buttons -->
    <button onclick="largest()">B1: Largest Number</button>
    <button onclick="sumAverage()">B2: Sum / Average</button>
    <button onclick="primeNumbers()">B3: Prime Numbers</button>
    <button onclick="secondLargest()">B4: Second Largest</button>

    <br><br>

    <h3>Your results displayed here</h3>

    <div id="result" style="border:1px solid black; padding:20px; width:400px;">
        Result will be displayed here
    </div>


    <script>

        // Get four numbers
        function getNumbers() {
            let n1 = Number($("#num1").val());
            let n2 = Number($("#num2").val());
            let n3 = Number($("#num3").val());
            let n4 = Number($("#num4").val());

            return [n1, n2, n3, n4];
        }


        // B1: Largest Number
        function largest() {
            let numbers = getNumbers();

            let max = Math.max(...numbers);

            $("#result").html("Largest Number = " + max);
        }


        // B2: Sum and Average
        function sumAverage() {
            let numbers = getNumbers();

            let sum = numbers[0] + numbers[1] + numbers[2] + numbers[3];
            let average = sum / 4;

            $("#result").html(
                "Sum = " + sum + "<br>" +
                "Average = " + average
            );
        }


        // B3: Prime Numbers
        function primeNumbers() {
            let numbers = getNumbers();
            let primes = [];

            for (let i = 0; i < numbers.length; i++) {

                if (isPrime(numbers[i])) {
                    primes.push(numbers[i]);
                }
            }

            if (primes.length > 0) {
                $("#result").html(
                    "Prime Numbers = " + primes.join(", ")
                );
            } else {
                $("#result").html("No prime numbers found.");
            }
        }


        // Check prime number
        function isPrime(num) {

            if (num < 2) {
                return false;
            }

            for (let i = 2; i <= Math.sqrt(num); i++) {

                if (num % i == 0) {
                    return false;
                }
            }

            return true;
        }


        // B4: Second Largest Number
        function secondLargest() {
            let numbers = getNumbers();

            // Remove duplicate numbers
            let unique = [...new Set(numbers)];

            if (unique.length < 2) {
                $("#result").html(
                    "Second largest number does not exist."
                );
                return;
            }

            unique.sort(function(a, b) {
                return b - a;
            });

            $("#result").html(
                "Second Largest Number = " + unique[1]
            );
        }

    </script>

</body>
</html>
