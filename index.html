
<!DOCTYPE html>
<html>
<head>
    <title>Mouse Events</title>
</head>

<body>

    <h2
        style="color: red;"
        onmouseover="changeColorGreen(this)"
        onmouseout="changeColorYellow(this)"
    >
        Saroj
    </h2>


    <script>

        function changeColorGreen(element) {
            element.style.color = "green";
        }

        function changeColorYellow(element) {
            element.style.color = "yellow";
        }

    </script>

</body>
</html>
